version: 2

models:
  - name: stg_incoming_order_change
    description: Raw change log rows, typed and renamed, one per line ever loaded.
    columns:
      - name: record_key
        data_tests: [unique, not_null]
      - name: op
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [I, U, D]
      - name: order_id
        data_tests: [not_null]
      - name: tx_seq
        data_tests: [not_null]
